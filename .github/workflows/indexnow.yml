name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ja.html"
      - "ko.html"
      - "sitemap.xml"
      - "content-*.js"
      - "i18n.js"
      - "app.js"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 90

      - name: Notify IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -w "\nHTTP %{http_code}\n" \
            -d '{
              "host": "chinavisit.org",
              "key": "00869675f174f36b12e5b37f660fc249",
              "keyLocation": "https://chinavisit.org/00869675f174f36b12e5b37f660fc249.txt",
              "urlList": [
                "https://chinavisit.org/",
                "https://chinavisit.org/ja.html",
                "https://chinavisit.org/ko.html"
              ]
            }'
